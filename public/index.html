<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relay - Chatsire</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 380px;
    }
    h1 {
      margin-bottom: 0.5rem;
      color: #5865f2;
    }
    p {
      color: #b9bbbe;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    input {
      padding: 0.75rem;
      border-radius: 4px;
      border: 1px solid #333;
      background: #2b2b2b;
      color: #fff;
      font-size: 1rem;
    }
    input:focus {
      outline: none;
      border-color: #5865f2;
    }
    button {
      padding: 0.75rem;
      border-radius: 4px;
      border: none;
      background: #5865f2;
      color: white;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background: #4752c4;
    }
    .toggle {
      margin-top: 1rem;
      font-size: 0.85rem;
      text-align: center;
      color: #b9bbbe;
    }
    .toggle-link {
      color: #5865f2;
      font-weight: bold;
      cursor: pointer;
      text-decoration: underline;
    }
    .message {
      margin-top: 1rem;
      font-size: 0.85rem;
      text-align: center;
      padding: 0.5rem;
      border-radius: 4px;
      display: none;
    }
    .error {
      display: block;
      background: rgba(240, 71, 71, 0.2);
      color: #f04747;
      border: 1px solid #f04747;
    }
    .success {
      display: block;
      background: rgba(67, 181, 129, 0.2);
      color: #43b581;
      border: 1px solid #43b581;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1 id="title">Relay</h1>
    <p id="subtitle">Create an account to chat with your friends.</p>

    <form id="auth-form">
      <input type="text" id="username" name="username" placeholder="Username" required autocomplete="username" />
      <input type="password" id="password" name="password" placeholder="Password" required autocomplete="current-password" />
      <button type="submit" id="submit-btn">Create account</button>
    </form>

    <div class="toggle" id="toggle-container">
      Have an account? <span class="toggle-link" id="toggle-btn">Log in</span>
    </div>

    <div class="message" id="message"></div>
  </div>

  <script>
    let isSignUp = true;

    const subtitle = document.getElementById('subtitle');
    const submitBtn = document.getElementById('submit-btn');
    const toggleContainer = document.getElementById('toggle-container');
    const authForm = document.getElementById('auth-form');
    const messageDiv = document.getElementById('message');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    function setupToggleListener() {
      const toggleBtn = document.getElementById('toggle-btn');
      if (!toggleBtn) return;
      toggleBtn.onclick = function() {
        isSignUp = !isSignUp;
        messageDiv.style.display = 'none';
        messageDiv.textContent = '';
        if (isSignUp) {
          subtitle.textContent = 'Create an account to chat with your friends.';
          submitBtn.textContent = 'Create account';
          toggleContainer.innerHTML = 'Have an account? <span class="toggle-link" id="toggle-btn">Log in</span>';
        } else {
          subtitle.textContent = 'Welcome back! Log in to start chatting.';
          submitBtn.textContent = 'Log in';
          toggleContainer.innerHTML = 'Need an account? <span class="toggle-link" id="toggle-btn">Register</span>';
        }
        setupToggleListener();
      };
    }
    setupToggleListener();

    authForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      messageDiv.style.display = 'none';
      messageDiv.textContent = '';

      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();

      if (!username || !password) {
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Please enter both username and password.';
        return;
      }

      const endpoint = isSignUp ? '/register' : '/login';

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username: username, password: password })
        });

        const data = await response.json();

        if (response.ok) {
          messageDiv.className = 'message success';
          messageDiv.textContent = data.message || 'Success!';
          if (isSignUp) {
            authForm.reset();
          }
        } else {
          messageDiv.className = 'message error';
          messageDiv.textContent = data.error || 'An error occurred.';
        }
      } catch (err) {
        console.error('Fetch error:', err);
        messageDiv.className = 'message error';
        messageDiv.textContent = 'Server connection failed. Please try again.';
      }
    });
  </script>
</body>
</html>
